<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Multi-Video Gallery</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  background:#10131a;color:#fff;
  font-family:Arial,sans-serif
}
.container{
  max-width:900px;margin:25px auto;
  padding:22px;background:#1c2230;
  border-radius:16px
}
h2{text-align:center}
input,button,select{
  width:100%;padding:13px;margin-top:12px;
  border:0;border-radius:8px;font-size:16px
}
input{background:#fff;color:#111}
button{
  background:#ff0033;color:#fff;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
#options{display:none}
#message{color:#ffc0c0}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;margin-top:20px
}
.video-card{
  background:#10131a;padding:10px;border-radius:10px;
  min-width:0
}
.video-card h3{font-size:14px}
.frame{
  width:100%;aspect-ratio:16/9;background:#000
}
iframe{width:100%;height:100%;border:0}
.note{color:#c5ccda;font-size:13px;line-height:1.6}
</style>
</head>

<body>
<div class="container">
  <h2>YouTube Video Gallery</h2>

  <input id="videoLink"
         type="url"
         placeholder="YouTube ভিডিওর লিংক পেস্ট করুন">

  <button id="okBtn">OK</button>

  <div id="options">
    <label for="count">কয়টি প্লেয়ার দেখতে চাও?</label>
    <select id="count">
      <option value="5">5 Videos</option>
      <option value="10">10 Videos</option>
      <option value="15">15 Videos</option>
      <option value="20">20 Videos</option>
      <option value="25">25 Videos</option>
      <option value="30">30 Videos</option>
      <option value="35">35 Videos</option>
      <option value="40">40 Videos</option>
      <option value="45">45 Videos</option>
      <option value="50">50 Videos</option>
    </select>

    <button id="showBtn">গ্যালারি তৈরি করো</button>
  </div>

  <p id="message" role="status"></p>

  <p class="note">
    দ্রষ্টব্য: একই ভিডিওর একাধিক প্লেয়ার তৈরি হতে পারে,
    তবে এগুলো আলাদা ভিউয়ের নিশ্চয়তা দেয় না। একসঙ্গে অনেক
    প্লেয়ার চালালে ফোন ধীর হতে পারে।
  </p>

  <div id="gallery" class="grid"></div>
</div>

<script>
"use strict";

const input = document.getElementById("videoLink");
const okBtn = document.getElementById("okBtn");
const options = document.getElementById("options");
const countSelect = document.getElementById("count");
const showBtn = document.getElementById("showBtn");
const message = document.getElementById("message");
const gallery = document.getElementById("gallery");

let videoId = "";

function getYouTubeId(value) {
  let url;

  try {
    url = new URL(value.trim());
  } catch {
    return null;
  }

  const host = url.hostname.toLowerCase();
  let id = "";

  if (host === "youtu.be") {
    id = url.pathname.split("/").filter(Boolean)[0] || "";
  } else if (
    ["youtube.com", "www.youtube.com", "m.youtube.com"]
      .includes(host)
  ) {
    if (url.pathname === "/watch") {
      id = url.searchParams.get("v") || "";
    } else {
      const match = url.pathname.match(
        /^\/(?:embed|shorts)\/([A-Za-z0-9_-]+)/
      );
      if (match) id = match[1];
    }
  }

  return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
}

okBtn.addEventListener("click", () => {
  const id = getYouTubeId(input.value);

  if (!id) {
    message.textContent = "সঠিক YouTube ভিডিও লিংক দিন।";
    options.style.display = "none";
    return;
  }

  videoId = id;
  message.textContent = "লিংক গ্রহণ করা হয়েছে। এবার সংখ্যা নির্বাচন করো।";
  options.style.display = "block";
  gallery.replaceChildren();
});

showBtn.addEventListener("click", () => {
  if (!videoId) {
    message.textContent = "প্রথমে ভিডিওর লিংক দিয়ে OK চাপুন।";
    return;
  }

  const count = Number(countSelect.value);

  if (![5,10,15,20,25,30,35,40,45,50].includes(count)) {
    message.textContent = "সঠিক সংখ্যা নির্বাচন করুন।";
    return;
  }

  gallery.replaceChildren();

  const fragment = document.createDocumentFragment();

  for (let i = 1; i <= count; i++) {
    const card = document.createElement("section");
    card.className = "video-card";

    const title = document.createElement("h3");
    title.textContent = `ভিডিও প্লেয়ার ${i}`;

    const frameWrap = document.createElement("div");
    frameWrap.className = "frame";

    const iframe = document.createElement("iframe");
    iframe.title = `YouTube video player ${i}`;
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allow =
      "accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;

    // প্লেয়ারগুলো তৈরি হবে; স্বয়ংক্রিয়ভাবে চালু হবে না।
    iframe.src = `https://www.youtube.com/embed/${videoId}`;

    frameWrap.appendChild(iframe);
    card.append(title, frameWrap);
    fragment.appendChild(card);
  }

  gallery.appendChild(fragment);
  message.textContent =
    `${count}টি প্লেয়ার তৈরি হয়েছে। ভিডিও চালাতে প্লেয়ারে Play চাপুন।`;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Video Player</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #10131a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 22px;
      background: #1c2230;
      border-radius: 16px;
    }

    h2 { text-align: center; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input { background: #fff; color: #111; }

    button {
      background: #ff0033;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .player {
      margin-top: 20px;
      aspect-ratio: 16 / 9;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #message { color: #ffc0c0; }
  </style>
</head>

<body>
  <div class="container">
    <h2>YouTube Player</h2>

    <input
      id="videoLink"
      type="url"
      placeholder="YouTube ভিডিওর লিংক দিন"
    >

    <button onclick="playVideo()">ভিডিও চালাও</button>

    <p id="message"></p>

    <div class="player" id="player" hidden>
      <iframe
        id="videoFrame"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <script>
    function playVideo() {
      const input = document.getElementById("videoLink");
      const message = document.getElementById("message");
      const player = document.getElementById("player");
      const frame = document.getElementById("videoFrame");

      let url;

      try {
        url = new URL(input.value.trim());
      } catch {
        message.textContent = "সঠিক YouTube লিংক দিন।";
        player.hidden = true;
        return;
      }

      const host = url.hostname.toLowerCase();
      let id = "";

      if (host === "youtu.be") {
        id = url.pathname.split("/").filter(Boolean)[0] || "";
      } else if (
        host === "youtube.com" ||
        host === "www.youtube.com" ||
        host === "m.youtube.com"
      ) {
        if (url.pathname === "/watch") {
          id = url.searchParams.get("v") || "";
        } else {
          const match = url.pathname.match(
            /^\/(?:embed|shorts)\/([A-Za-z0-9_-]+)/
          );
          if (match) id = match[1];
        }
      }

      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
        message.textContent = "লিংকটি সঠিক YouTube ভিডিওর হতে হবে।";
        player.hidden = true;
        frame.src = "";
        return;
      }

      message.textContent = "";
      frame.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id);

      player.hidden = false;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | Location Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #10131a;
  color: #f5f7ff;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 950px;
  margin: 25px auto;
  padding: 22px;
  background: #1c2230;
  border-radius: 16px;
}

h1, h2 { text-align: center; }

input, button {
  display: block;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}

input {
  color: #111;
  background: #fff;
}

button {
  color: #fff;
  background: #ff0033;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .6; }

.secondary { background: #34435c; }

#dashboard, #loginSection { display: none; }

#status {
  color: #cbd5e1;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.location-card {
  margin-top: 16px;
  padding: 16px;
  background: #101722;
  border: 1px solid #354158;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.location-card p {
  line-height: 1.6;
  margin: 8px 0;
}

a { color: #75c9ff; }

.small {
  color: #aeb9ca;
  font-size: 13px;
  line-height: 1.6;
}

.hidden { display: none !important; }
</style>
</head>

<body>
<div class="container">
  <h1>Admin Dashboard</h1>
  <p class="small">
    এই প্যানেল শুধু Firebase-এ অনুমোদিত অ্যাডমিনের জন্য।
    এখানে কেবল ব্যবহারকারীর সম্মতিতে শেয়ার করা লোকেশন দেখানো হবে।
  </p>

  <section id="loginSection">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
        required>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required>

      <button id="loginBtn" type="submit">Login</button>
    </form>
  </section>

  <section id="dashboard">
    <h2>Shared Locations</h2>
    <p id="adminInfo" class="small"></p>
    <button id="refreshBtn" class="secondary" type="button">
      Refresh Locations
    </button>
    <button id="logoutBtn" type="button">Logout</button>
    <div id="locations"></div>
  </section>

  <p id="status" role="status">Firebase সংযোগ পরীক্ষা হচ্ছে...</p>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs
} from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCO4yzdUKAiqPXr-raA-2bbyaN-ffaYDOI",
  authDomain: "adminpnal.firebaseapp.com",
  projectId: "adminpnal",
  storageBucket: "adminpnal.firebasestorage.app",
  messagingSenderId: "65312084790",
  appId: "1:65312084790:web:6dfee5894652a000395997",
  measurementId: "G-B7BGB87FMD"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const refreshBtn = document.getElementById("refreshBtn");
const logoutBtn = document.getElementById("logoutBtn");
const status = document.getElementById("status");
const locations = document.getElementById("locations");
const adminInfo = document.getElementById("adminInfo");

let currentAdminUid = null;
let checkingAuth = true;

function setStatus(text) {
  status.textContent = text;
}

function makeText(tag, text, className = "") {
  const element = document.createElement(tag);
  element.textContent = text;

  if (className) element.className = className;
  return element;
}

function formatDate(value) {
  if (!value || typeof value.toDate !== "function") {
    return "সময় পাওয়া যায়নি";
  }

  return value.toDate().toLocaleString("bn-BD");
}

function renderLocation(id, data) {
  const card = document.createElement("article");
  card.className = "location-card";

  card.appendChild(makeText("h3", "Shared Location"));

  card.appendChild(makeText("p", "Record ID: " + id));

  card.appendChild(makeText(
    "p",
    "Latitude: " + data.latitude
  ));

  card.appendChild(makeText(
    "p",
    "Longitude: " + data.longitude
  ));

  card.appendChild(makeText(
    "p",
    "GPS Accuracy: " + data.accuracy + " meters"
  ));

  card.appendChild(makeText(
    "p",
    "Shared At: " + formatDate(data.sharedAt)
  ));

  card.appendChild(makeText(
    "p",
    "Consent: " + (data.consent === true ? "Yes" : "No")
  ));

  card.appendChild(makeText(
    "p",
    "Browser Information: " + (data.userAgent || "Unavailable")
  ));

  if (
    typeof data.latitude === "number" &&
    typeof data.longitude === "number" &&
    Number.isFinite(data.latitude) &&
    Number.isFinite(data.longitude) &&
    data.latitude >= -90 &&
    data.latitude <= 90 &&
    data.longitude >= -180 &&
    data.longitude <= 180
  ) {
    const mapLink = document.createElement("a");
    mapLink.href =
      "https://www.google.com/maps?q=" +
      encodeURIComponent(data.latitude + "," + data.longitude);
    mapLink.target = "_blank";
    mapLink.rel = "noopener noreferrer";
    mapLink.textContent = "Google Maps-এ দেখুন";
    card.appendChild(mapLink);
  }

  return card;
}

async function verifyAdmin(user) {
  const adminRef = doc(db, "admins", user.uid);
  const adminSnap = await getDoc(adminRef);

  return adminSnap.exists() &&
    adminSnap.data().role === "admin";
}

async function loadLocations() {
  if (!auth.currentUser || auth.currentUser.uid !== currentAdminUid) {
    setStatus("অনুমতি যাচাই করা হয়নি। আবার লগইন করো।");
    return;
  }

  refreshBtn.disabled = true;
  locations.replaceChildren();
  setStatus("লোকেশন লোড হচ্ছে...");

  try {
    // Firestore Rules must restrict this read to verified admins.
    const snapshot = await getDocs(
      collection(db, "sharedLocations")
    );

    if (snapshot.empty) {
      setStatus("এখনো কোনো সম্মতিতে শেয়ার করা লোকেশন পাওয়া যায়নি।");
      return;
    }

    const fragment = document.createDocumentFragment();

    snapshot.forEach((record) => {
      const data = record.data();

      if (
        data.consent === true &&
        typeof data.latitude === "number" &&
        typeof data.longitude === "number"
      ) {
        fragment.appendChild(renderLocation(record.id, data));
      }
    });

    locations.appendChild(fragment);

    setStatus(
      "মোট রেকর্ড: " + snapshot.size +
      "। সম্মতিসহ বৈধ লোকেশন নিচে দেখানো হয়েছে।"
    );
  } catch (error) {
    console.error(error);
    setStatus(
      "ডেটা লোড হয়নি। Firestore Rules, Admin UID ও ইন্টারনেট পরীক্ষা করো।"
    );
  } finally {
    refreshBtn.disabled = false;
  }
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  loginBtn.disabled = true;
  setStatus("লগইন ও অ্যাডমিন অনুমতি যাচাই হচ্ছে...");

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const credential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const allowed = await verifyAdmin(credential.user);

    if (!allowed) {
      await signOut(auth);
      setStatus(
        "এই অ্যাকাউন্ট অ্যাডমিন হিসেবে অনুমোদিত নয়।"
      );
      return;
    }

    currentAdminUid = credential.user.uid;
    loginSection.style.display = "none";
    dashboard.style.display = "block";
    adminInfo.textContent = "Logged in: " + credential.user.email;
    await loadLocations();
  } catch (error) {
    console.error(error);
    setStatus(
      "লগইন ব্যর্থ। Email/Password, Authentication ও Admin UID পরীক্ষা করো।"
    );
  } finally {
    loginBtn.disabled = false;
  }
});

refreshBtn.addEventListener("click", loadLocations);

logoutBtn.addEventListener("click", async () => {
  logoutBtn.disabled = true;

  try {
    await signOut(auth);
    currentAdminUid = null;
    locations.replaceChildren();
    dashboard.style.display = "none";
    loginSection.style.display = "block";
    setStatus("লগআউট হয়েছে।");
  } catch (error) {
    console.error(error);
    setStatus("লগআউট করা যায়নি। আবার চেষ্টা করো।");
  } finally {
    logoutBtn.disabled = false;
  }
});

onAuthStateChanged(auth, async (user) => {
  if (checkingAuth) {
    checkingAuth = false;

    if (user) {
      try {
        const allowed = await verifyAdmin(user);

        if (allowed) {
          currentAdminUid = user.uid;
          loginSection.style.display = "none";
          dashboard.style.display = "block";
          adminInfo.textContent = "Logged in: " + (user.email || user.uid);
          await loadLocations();
          return;
        }

        await signOut(auth);
      } catch (error) {
        console.error(error);
        await signOut(auth).catch(() => {});
      }
    }

    loginSection.style.display = "block";
    dashboard.style.display = "none";
    setStatus("অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করো।");
  }
});
</script>
</body>
  </html>
